name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Tree only (no file contents): the build needs the file list and the commit SHA.
      # GOOGLE_FONTS_REF pins the commit that the font URLs point to. Change it
      # after you rebuild google-fonts-db.json from a newer clone.
      - name: Fetch google/fonts file list
        env:
          GOOGLE_FONTS_REF: 647e52b1cbc941916c322994994bbe2e3a08ca6e
        run: |
          git init -q google-fonts
          git -C google-fonts fetch -q --depth=1 --filter=blob:none https://github.com/google/fonts.git "$GOOGLE_FONTS_REF"
          git -C google-fonts update-ref HEAD FETCH_HEAD
      - run: npm run test:unit
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
